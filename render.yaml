services:
  - type: web
    name: bookiba-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Oe5MjQgky8wv@ep-delicate-dust-aq9c1mft.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: bookiba-admin
    env: docker
    dockerfilePath: admin-web/Dockerfile
    dockerContext: admin-web
    plan: free
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_Oe5MjQgky8wv@ep-delicate-dust-aq9c1mft.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
      # Internal Render private network URL — avoids public internet + cold-start delays
      - key: KTOR_WEBHOOK_URL
        value: http://bookiba-backend:8080/api/v1/internal/notify-order
      - key: INTERNAL_WEBHOOK_SECRET
        value: my-internal-secret
